name: Build wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to validate (tag releases always build all)'
        type: choice
        default: all
        options: [all, linux, windows, windows-arm64, windows-amd64-sycl, macos, windows-runtime]
      runtime_run_id:
        description: 'Existing build run for the Windows runtime diagnostic only'
        required: false
        type: string

jobs:
  diagnose_windows_runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'windows-runtime'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wheels-windows-amd64
          path: runtime-check
          run-id: ${{ inputs.runtime_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install pefile
      - name: Load each bundled DLL without oneAPI SDK
        run: python tools/diagnose_windows_runtime.py runtime-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-windows-runtime
          path: runtime-check/*.json

  build_linux_x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .gpu-stage
            .gpu-tools
          key: gpu-manylinux228-${{ runner.arch }}-sycl-vulkan-${{ hashFiles('llama-cpp-revision.txt', 'third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/setup_linux_gpu.sh', 'tools/build_gpu_backends.py', 'tools/build_level_zero.py') }}
          restore-keys: gpu-manylinux228-${{ runner.arch }}-sycl-vulkan-
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Linux x86_64, CPU+Vulkan+SYCL)
        run: cibuildwheel --output-dir wheelhouse --archs x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-linux-x86_64
          path: build/ci-wheel-audits/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse/*.whl

  build_linux_aarch64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .gpu-stage
            .gpu-tools
          key: gpu-manylinux228-${{ runner.arch }}-sycl-vulkan-${{ hashFiles('llama-cpp-revision.txt', 'third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/setup_linux_gpu.sh', 'tools/build_gpu_backends.py', 'tools/build_level_zero.py') }}
          restore-keys: gpu-manylinux228-${{ runner.arch }}-sycl-vulkan-
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Linux aarch64, CPU+Vulkan)
        run: cibuildwheel --output-dir wheelhouse --archs aarch64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-linux-aarch64
          path: build/ci-wheel-audits/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: wheelhouse/*.whl

  build_macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (macOS arm64, Metal)
        run: cibuildwheel --output-dir wheelhouse --archs arm64
      - name: Audit macOS deployment and dependencies
        run: |
          mkdir -p wheel-audits
          for wheel in wheelhouse/*.whl; do
            python tools/verify_macos_wheel.py "$wheel" > "wheel-audits/$(basename "$wheel").json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: audits-macos-arm64
          path: wheel-audits/*.json

  check_macos_older_sdk:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Build and check with older SDK
        env:
          CIBW_BUILD: cp312-*
        run: |
          pip install cibuildwheel==4.3.0
          cibuildwheel --output-dir wheelhouse --archs arm64
          python tools/verify_macos_wheel.py wheelhouse/*.whl

  build_macos_x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    # Rosetta 2 构建 Intel CPU wheel，保持同一 macOS 14 部署下限。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (macOS x86_64, CPU only — no Metal on Intel)
        run: cibuildwheel --output-dir wheelhouse --archs x86_64
      - name: Audit macOS deployment and dependencies
        run: |
          for wheel in wheelhouse/*.whl; do
            python tools/verify_macos_wheel.py "$wheel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: wheelhouse/*.whl

  build_windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == 'windows-amd64-sycl'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: |
            C:/VulkanSDK
            C:/mineru-gpu-backends
          key: gpu-windows-amd64-sycl-vulkan-${{ hashFiles('llama-cpp-revision.txt', 'third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/setup_windows_gpu.py', 'tools/build_gpu_backends.py', 'tools/sycl_profile.py', 'tools/audit_sycl_aot.py', 'tools/download_sdk.py', 'tools/build_level_zero.py') }}
          restore-keys: gpu-windows-amd64-sycl-vulkan-
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Windows AMD64, CPU+Vulkan+SYCL)
        run: |
          if ("${{ inputs.platform }}" -eq "windows-amd64-sycl") {
            # 仅复核变更的 AOT MODULE、设备过滤和安装边界；其他后端模型回归沿用已验证记录。
            $env:CIBW_TEST_COMMAND = 'python {project}/tools/windows_sycl_smoke.py && python -m pytest {project}/tests/test_sycl_aot.py -q'
          }
          cibuildwheel --output-dir wheelhouse --archs AMD64
      - name: Audit AMD64 wheel AOT images and stable ABI
        run: |
          pip install packaging abi3audit
          python tools/verify_wheels.py wheelhouse --allow-subset
          Get-ChildItem wheelhouse/*.whl | ForEach-Object {
            abi3audit --strict $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-windows-amd64-sycl
          path: C:/mineru-gpu-backends/sycl-build.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-amd64
          path: wheelhouse/*.whl

  build_windows_arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == 'windows-arm64'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSVC dev environment (ARM64 native)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - uses: actions/cache@v4
        with:
          path: C:/VulkanSDK-ARM64
          key: gpu-windows-arm64-vulkan-1.4.350.0-${{ hashFiles('tools/setup_windows_gpu.py', 'tools/windows_pe.py') }}
          restore-keys: gpu-windows-arm64-vulkan-1.4.350.0-
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Windows ARM64, CPU+Vulkan)
        # ggml-cpu 的 ARM 实现需要 clang-cl；固定 SDK 的工具与链接库均使用原生 ARM64。
        run: |
          if ("${{ inputs.platform }}" -eq "windows-arm64") {
            # 增量验证只检查新 MODULE 与回退；完整发布仍运行公共 API 回归。
            $env:CIBW_TEST_COMMAND = 'python {project}/tools/windows_vulkan_smoke.py'
          }
          cibuildwheel --output-dir wheelhouse --archs ARM64
      - name: Audit ARM64 wheel architecture and stable ABI
        run: |
          pip install packaging abi3audit
          python tools/verify_wheels.py wheelhouse --allow-subset
          Get-ChildItem wheelhouse/*.whl | ForEach-Object {
            abi3audit --strict $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-arm64
          path: wheelhouse/*.whl

  validate_wheels:
    needs:
      - build_linux_x86_64
      - build_linux_aarch64
      - build_macos
      - check_macos_older_sdk
      - build_macos_x86_64
      - build_windows
      - build_windows_arm64
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Verify six stable-ABI wheels
        run: |
          pip install packaging abi3audit
          python tools/verify_wheels.py dist
          abi3audit --strict dist/*.whl

  publish:
    needs: [validate_wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
