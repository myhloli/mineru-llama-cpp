name: Build wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platforms to validate (tag releases always build all)'
        type: choice
        default: all
        options: [all, linux, windows, macos]

jobs:
  build_linux_x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .gpu-stage
            .gpu-tools
          key: gpu-manylinux228-${{ runner.arch }}-cuda-sycl-${{ hashFiles('third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/*gpu*', 'tools/install_cuda.py') }}
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Linux x86_64, CPU+Vulkan+CUDA+SYCL)
        run: cibuildwheel --output-dir wheelhouse --archs x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse/*.whl

  build_linux_aarch64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .gpu-stage
            .gpu-tools
          key: gpu-manylinux228-${{ runner.arch }}-cuda-sycl-${{ hashFiles('third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/*gpu*', 'tools/install_cuda.py') }}
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Linux aarch64, CPU+Vulkan+CUDA)
        run: cibuildwheel --output-dir wheelhouse --archs aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: wheelhouse/*.whl

  build_macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (macOS arm64, Metal)
        run: cibuildwheel --output-dir wheelhouse --archs arm64
      - name: Audit macOS deployment and dependencies
        run: |
          mkdir -p wheel-audits
          for wheel in wheelhouse/*.whl; do
            python tools/verify_macos_wheel.py "$wheel" > "wheel-audits/$(basename "$wheel").json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: audits-macos-arm64
          path: wheel-audits/*.json

  check_macos_older_sdk:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Build and check with older SDK
        env:
          CIBW_BUILD: cp312-*
        run: |
          pip install cibuildwheel==4.3.0
          cibuildwheel --output-dir wheelhouse --archs arm64
          python tools/verify_macos_wheel.py wheelhouse/*.whl

  build_macos_x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    # Rosetta 2 构建 Intel CPU wheel，保持同一 macOS 14 部署下限。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (macOS x86_64, CPU only — no Metal on Intel)
        run: cibuildwheel --output-dir wheelhouse --archs x86_64
      - name: Audit macOS deployment and dependencies
        run: |
          for wheel in wheelhouse/*.whl; do
            python tools/verify_macos_wheel.py "$wheel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: wheelhouse/*.whl

  build_windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: |
            C:/VulkanSDK
            C:/mineru-gpu-backends
          key: gpu-windows-amd64-cuda-sycl-${{ hashFiles('third_party/llama.cpp/ggml/**', 'patches/llama.cpp/*.patch', 'tools/*gpu*', 'tools/install_cuda.py') }}
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Windows AMD64, CPU+Vulkan+CUDA+SYCL)
        run: cibuildwheel --output-dir wheelhouse --archs AMD64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-amd64
          path: wheelhouse/*.whl

  build_windows_arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup MSVC dev environment (ARM64 native)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Install cibuildwheel
        run: pip install cibuildwheel==4.3.0
      - name: Build wheels (Windows ARM64, CPU)
        # ggml-cpu rejects MSVC on ARM — use clang-cl via the override
        # block in pyproject.toml. Vulkan is skipped on ARM64.
        run: cibuildwheel --output-dir wheelhouse --archs ARM64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-arm64
          path: wheelhouse/*.whl

  validate_wheels:
    needs:
      - build_linux_x86_64
      - build_linux_aarch64
      - build_macos
      - check_macos_older_sdk
      - build_macos_x86_64
      - build_windows
      - build_windows_arm64
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Verify six stable-ABI wheels
        run: |
          pip install packaging abi3audit
          python tools/verify_wheels.py dist
          abi3audit --strict dist/*.whl

  publish:
    needs: [validate_wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
