name: Publish wheels to PyPI (manual)

# 从已完成的构建运行中选择 abi3 产物；上传前验证平台、ABI 及运行库边界。
# 允许明确筛选部分平台，避免重传 PyPI 上已经存在的同名文件。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-wheels run ID whose wheel artifacts to publish'
        required: true
        type: string
      wheel_glob:
        description: 'fnmatch pattern (against the file basename) selecting which wheels to upload'
        required: false
        default: '*cp310-abi3-*'

permissions:
  contents: read
  actions: read   # download-artifact@v4 needs this to fetch artifacts cross-run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only wheels matching the pattern
        run: |
          find dist -name '*.whl' ! -name "${{ inputs.wheel_glob }}" -delete
          echo "Wheels selected for upload:"
          ls -la dist/

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify selected stable-ABI wheels
        run: |
          pip install packaging abi3audit
          python tools/verify_wheels.py dist --allow-subset
          abi3audit --strict dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
