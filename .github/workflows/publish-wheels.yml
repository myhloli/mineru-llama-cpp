name: Publish wheels to PyPI (manual)

# Manual release helper: publish a filtered subset of wheels produced by an
# existing build-wheels run, without re-tagging.
#
# Primary use case: appending wheels for a newly-supported Python version
# (e.g. cp314) to an already-released version on PyPI. PyPI rejects re-uploads
# of existing file names but accepts new file names under an existing version,
# so "release 0.1.0, then add cp314 later" is a legitimate operation — it just
# cannot go through the tag-triggered publish job in build-wheels.yml, because
# that job uploads every artifact and would die on the 32 already-published
# file names (v0.1.0 tag already exists and cannot be re-pointed).
#
# Security notes:
# - workflow_dispatch can only be triggered by collaborators with write access,
#   so PYPI_TOKEN is never exposed to untrusted input.
# - The token itself lives only in repo secrets; it never appears in logs.
# - The wheel_glob input only filters which local files get uploaded; it cannot
#   alter the upload destination or credentials.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build-wheels run ID whose wheel artifacts to publish'
        required: true
        type: string
      wheel_glob:
        description: 'fnmatch pattern (against the file basename) selecting which wheels to upload'
        required: false
        default: '*cp314-*'

permissions:
  contents: read
  actions: read   # download-artifact@v4 needs this to fetch artifacts cross-run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only wheels matching the pattern
        run: |
          find dist -name '*.whl' ! -name "${{ inputs.wheel_glob }}" -delete
          echo "Wheels selected for upload:"
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
